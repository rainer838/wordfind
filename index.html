<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gene Editing Word Search</title>

<style>

body{
    margin:0;
    background:#0f172a;
    font-family:Arial;
    color:white;
    text-align:center;
}

h1{
    margin-top:20px;
}

#grid{
    display:grid;
    grid-template-columns:repeat(12,45px);
    gap:4px;
    justify-content:center;
    margin-top:20px;
}

.cell{
    width:45px;
    height:45px;
    background:#1e293b;
    border-radius:8px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:24px;
    font-weight:bold;
    cursor:pointer;
    transition:0.2s;
    user-select:none;
}

.cell.selected{
    background:#38bdf8;
    transform:scale(1.1);
}

.cell.found{
    background:#22c55e;
    animation:pop .3s ease;
}

@keyframes pop{
    0%{transform:scale(0.5);}
    100%{transform:scale(1);}
}

#wordList{
    margin-top:25px;
    font-size:20px;
}

.done{
    text-decoration:line-through;
    color:#22c55e;
}

</style>
</head>

<body>

<h1>Gene Editing Word Search</h1>
<p>Drag your mouse across letters to find the hidden words!</p>

<div id="grid"></div>

<div id="wordList"></div>

<script>

const words = [
    "DNA",
    "RNA",
    "GENE",
    "CRISPR",
    "MUTATION",
    "GENOME"
];

const size = 12;

const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

const board = Array(size).fill().map(()=>Array(size).fill(""));

function placeWord(word,row,col,direction){

    if(direction === "horizontal"){

        for(let i=0;i<word.length;i++){
            board[row][col+i] = word[i];
        }

    }else{

        for(let i=0;i<word.length;i++){
            board[row+i][col] = word[i];
        }
    }
}

placeWord("DNA",0,0,"horizontal");
placeWord("RNA",2,1,"horizontal");
placeWord("GENE",4,3,"horizontal");
placeWord("CRISPR",1,8,"vertical");
placeWord("MUTATION",8,1,"horizontal");
placeWord("GENOME",5,10,"vertical");

for(let r=0;r<size;r++){
    for(let c=0;c<size;c++){

        if(board[r][c] === ""){

            board[r][c] =
            letters[Math.floor(Math.random()*letters.length)];
        }
    }
}

const grid = document.getElementById("grid");

let selected = [];
let currentWord = "";
let mouseDown = false;

for(let r=0;r<size;r++){

    for(let c=0;c<size;c++){

        const cell = document.createElement("div");

        cell.classList.add("cell");

        cell.textContent = board[r][c];

        cell.dataset.letter = board[r][c];

        cell.dataset.row = r;
        cell.dataset.col = c;

        cell.addEventListener("mousedown",()=>{

            mouseDown = true;

            addCell(cell);
        });

        cell.addEventListener("mouseenter",()=>{

            if(mouseDown){

                addCell(cell);
            }
        });

        grid.appendChild(cell);
    }
}

document.addEventListener("mouseup",()=>{

    checkWord();

    clearSelection();

    mouseDown = false;
});

function addCell(cell){

    if(selected.includes(cell)) return;

    selected.push(cell);

    currentWord += cell.dataset.letter;

    cell.classList.add("selected");
}

function checkWord(){

    if(words.includes(currentWord)){

        selected.forEach(cell=>{

            cell.classList.remove("selected");

            cell.classList.add("found");
        });

        document
        .getElementById(currentWord)
        .classList.add("done");
    }
}

function clearSelection(){

    selected.forEach(cell=>{

        if(!cell.classList.contains("found")){

            cell.classList.remove("selected");
        }
    });

    selected = [];

    currentWord = "";
}

const wordList = document.getElementById("wordList");

words.forEach(word=>{

    const span = document.createElement("span");

    span.innerText = word + " ";

    span.id = word;

    span.style.margin = "10px";

    wordList.appendChild(span);
});

</script>

</body>
</html>
