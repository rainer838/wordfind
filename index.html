<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Gene Editing Word Search</title>

<style>
    body{
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg,#0f172a,#1e293b);
        color:white;
        text-align:center;
        margin:0;
        padding:20px;
    }

    h1{
        margin-bottom:10px;
    }

    #game{
        display:grid;
        grid-template-columns: repeat(10,50px);
        gap:4px;
        justify-content:center;
        margin:20px auto;
        user-select:none;
    }

    .cell{
        width:50px;
        height:50px;
        background:#334155;
        border-radius:10px;
        display:flex;
        justify-content:center;
        align-items:center;
        font-size:24px;
        font-weight:bold;
        cursor:pointer;
        transition:0.2s;
    }

    .cell.selected{
        background:#38bdf8;
        transform:scale(1.1);
    }

    .cell.found{
        background:#22c55e;
        animation:pop 0.4s ease;
    }

    @keyframes pop{
        0%{transform:scale(0.5);}
        70%{transform:scale(1.2);}
        100%{transform:scale(1);}
    }

    #words{
        margin-top:20px;
        font-size:20px;
    }

    .done{
        text-decoration: line-through;
        color:#22c55e;
    }
</style>
</head>
<body>

<h1>Gene Editing Word Search</h1>
<p>Drag your mouse across letters to find words!</p>

<div id="game"></div>

<div id="words"></div>

<script>
const words = [
    "DNA",
    "RNA",
    "GENE",
    "CRISPR",
    "MUTATION"
];

const size = 10;

const grid = [
['D','N','A','Q','W','E','R','T','Y','U'],
['A','S','D','F','G','H','J','K','L','I'],
['R','N','A','P','O','I','U','Y','T','R'],
['G','E','N','E','Z','X','C','V','B','N'],
['M','U','T','A','T','I','O','N','A','M'],
['Q','W','E','R','T','Y','U','I','O','P'],
['C','R','I','S','P','R','A','S','D','F'],
['L','K','J','H','G','F','D','S','A','Q'],
['Z','X','C','V','B','N','M','Q','W','E'],
['P','O','I','U','Y','T','R','E','W','Q']
];

const game = document.getElementById("game");
const wordsDiv = document.getElementById("words");

let selectedCells = [];
let currentWord = "";
let isMouseDown = false;

words.forEach(word=>{
    const span = document.createElement("span");
    span.textContent = word + " ";
    span.id = word;
    span.style.margin = "10px";
    wordsDiv.appendChild(span);
});

for(let row=0; row<size; row++){
    for(let col=0; col<size; col++){

        const cell = document.createElement("div");
        cell.classList.add("cell");
        cell.textContent = grid[row][col];

        cell.dataset.letter = grid[row][col];

        cell.addEventListener("mousedown", ()=>{
            isMouseDown = true;
            selectCell(cell);
        });

        cell.addEventListener("mouseenter", ()=>{
            if(isMouseDown){
                selectCell(cell);
            }
        });

        game.appendChild(cell);
    }
}

document.addEventListener("mouseup", ()=>{
    checkWord();
    clearSelection();
    isMouseDown = false;
});

function selectCell(cell){

    if(selectedCells.includes(cell)) return;

    selectedCells.push(cell);
    currentWord += cell.dataset.letter;

    cell.classList.add("selected");
}

function checkWord(){

    if(words.includes(currentWord)){

        selectedCells.forEach(cell=>{
            cell.classList.remove("selected");
            cell.classList.add("found");
        });

        document.getElementById(currentWord).classList.add("done");
    }
}

function clearSelection(){

    selectedCells.forEach(cell=>{
        if(!cell.classList.contains("found")){
            cell.classList.remove("selected");
        }
    });

    selectedCells = [];
    currentWord = "";
}
</script>

</body>
</html>
